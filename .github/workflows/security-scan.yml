# Security & quality gate — universal jobs.
# /init-security concatenates this with the language fragments in this directory
# and writes the result to .github/workflows/security-scan.yml
#
# NOTE: no step here ends in `|| true`. A gate that cannot fail is theater —
# if a check is too noisy for a repo, narrow its scope or delete the job,
# don't neuter it.

name: Security & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
  # ============================================
  # PYTHON — appended when *.py files are present
  # ============================================
  python-security:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install 'bandit[toml]'

      - name: Run Bandit
        run: bandit -r . -ll

  python-quality:
    name: Type Check, Lint & Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mypy ruff pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install jsonschema requests==2.32.5  # test-only and tools/corpus dependencies

      - name: Ruff
        run: ruff check . --output-format=github

      - name: mypy
        run: mypy . --strict --ignore-missing-imports

      - name: pytest
        run: pytest --cov=. --cov-report=xml

  python-deps:
    name: Dependency CVEs (pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
